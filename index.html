ددي الموقف التعليمي. الخطوة ٢: قارني البدائل بمدى دعمها للتعلم. الخطوة ٣: اختاري الإجراء الذي يقدم دليلًا على التحسن. حددي الهدف المشترك، وقدمي مستويات دعم مختلفة، ثم قارني الأداء بالمؤشر نفسه."},{"id":3,"stage":1,"topic":"التعلم النشط","q":"في بداية الحصة، أي ممارسة تجعل الطالبة أكثر مشاركة في بناء المعرفة؟","opts":["التفكير الفردي ثم المناقشة الثنائية","الإلقاء المستمر دون أسئلة","نسخ التعريفات فقط","منع العمل الجماعي"],"a":0,"explain":"الخطوة ١: حددي الموقف التعليمي. الخطوة ٢: قارني البدائل بمدى دعمها للتعلم. الخطوة ٣: اختاري الإجراء الذي يقدم دليلًا على التحسن. ابدئي بمهمة تفكير، ثم تبادل أفكار، ثم مشاركة النتائج والتغذية الراجعة."},{"id":4,"stage":1,"topic":"التغذية الراجعة","q":"في بداية الحصة، ما التغذية الراجعة الأكثر فاعلية بعد حل خاطئ؟","opts":["تحديد موضع الخطأ وإرشاد الطالبة للتصحيح","قول إجابتك خطأ فقط","مقارنة الطالبة بزميلاتها","إعطاء الدرجة دون تعليق"],"a":0,"explain":"الخطوة ١: حددي الموقف التعليمي. الخطوة ٢: قارني البدائل بمدى دعمها للتعلم. الخطوة ٣: اختاري الإجراء الذي يقدم دليلًا على التحسن. اشرحي الخطوة غير الصحيحة، وقدمي تلميحًا قابلًا للتنفيذ ثم أعيدي التحقق."},{"id":5,"stage":1,"topic":"التخطيط","q":"في بداية الحصة، ما أول خطوة عند تصميم درس قائم على ناتج تعلم؟","opts":["صياغة ناتج تعلم قابل للقياس","اختيار الزينة للعرض","تحديد الواجب قبل الهدف","بدء الشرح دون تقويم"],"a":0,"explain":"الخطوة ١: حددي الموقف التعليمي. الخطوة ٢: قارني البدائل بمدى دعمها للتعلم. الخطوة ٣: اختاري الإجراء الذي يقدم دليلًا على التحسن. حددي ما ستستطيع الطالبة أداءه، ثم اختاري الدليل على التعلم والأنشطة المناسبة."},{"id":6,"stage":1,"topic":"إدارة الصف","q":"في بداية الحصة، كيف تعالج المعلمة تكرار المقاطعة أثناء المناقشة؟","opts":["تذكير بالقواعد وتعزيز الالتزام بها","إيقاف كل المناقشات","معاقبة الصف كله فورًا","تجاهل جميع المقاطعات"],"a":0,"explain":"الخطوة ١: حددي الموقف التعليمي. الخطوة ٢: قارني البدائل بمدى دعمها للتعلم. الخطوة ٣: اختاري الإجراء الذي يقدم دليلًا على التحسن. راجعي قاعدة المشاركة، وطبقيها باتساق، وعززي السلوك الإيجابي وتابعي التحسن."},{"id":7,"stage":1,"topic":"التعلم التعاوني","q":"في بداية الحصة، ما الذي يرفع جودة عمل المجموعات؟","opts":["توزيع الأدوار ومعايير النجاح","ترك الأدوار غامضة","تكليف طالبة واحدة بكل العمل","تقييم المجموعة دون ملاحظة"],"a":0,"explain":"الخطوة ١: حددي الموقف التعليمي. الخطوة ٢: قارني البدائل بمدى دعمها للتعلم. الخطوة ٣: اختاري الإجراء الذي يقدم دليلًا على التحسن. حددي الأدوار، وضعي معيارًا للمنتج، وراقبي مشاركة كل طالبة."},{"id":8,"stage":1,"topic":"التقويم التشخيصي","q":"في بداية الحصة، متى يكون التقويم التشخيصي أكثر فائدة؟","opts":["قبل بدء وحدة لتحديد المعرفة السابقة","بعد انتهاء العام فقط","بعد إعلان الدرجات النهائية","بديلًا عن جميع الأنشطة"],"a":0,"explain":"الخطوة ١: حددي الموقف التعليمي. الخطوة ٢: قارني البدائل بمدى دعمها للتعلم. الخطوة ٣: اختاري الإجراء الذي يقدم دليلًا على التحسن. اختبري المتطلبات السابقة، ثم صنفي الاحتياجات وحددي نقطة البداية."},{"id":9,"stage":1,"topic":"التعليم الشامل","q":"في بداية الحصة، ما الاستجابة الأنسب لطالبة تحتاج وقتًا إضافيًا لمعالجة المعلومات؟","opts":["إتاحة وقت مناسب ودعم بصري","إلغاء مشاركتها","الإسراع في طرح الأسئلة","إعطاؤها مهام غير مرتبطة"],"a":0,"explain":"الخطوة ١: حددي الموقف التعليمي. الخطوة ٢: قارني البدائل بمدى دعمها للتعلم. الخطوة ٣: اختاري الإجراء الذي يقدم دليلًا على التحسن. حددي حاجز التعلم، وقدمي تيسيرًا مناسبًا دون تغيير الهدف الأساسي."},{"id":10,"stage":1,"topic":"مهارات التفكير","q":"في بداية الحصة، أي سؤال يدعم التفكير الناقد؟","opts":["ما الدليل الذي يدعم استنتاجك؟","ما عنوان الدرس فقط؟","هل نسخت الإجابة؟","كم سطرًا كتبتِ؟"],"a":0,"explain":"الخطوة ١: حددي الموقف التعليمي. الخطوة ٢: قارني البدائل بمدى دعمها للتعلم. الخطوة ٣: اختاري الإجراء الذي يقدم دليلًا على التحسن. اطلبي دليلًا وتفسيرًا، ثم ناقشي قوة الدليل واحتمالات التفسير البديلة."},{"id":11,"stage":1,"topic":"التقويم التكويني","q":"أثناء نشاط جماعي، ما الإجراء الأنسب عندما تكشف بطاقة الخروج عن سوء فهم لدى عدد من الطالبات؟","opts":["إعادة شرح المهارة بأمثلة مختلفة","تجاهل النتائج حتى الاختبار النهائي","رفع درجة جميع الطالبات","إلغاء الدرس التالي"],"a":0,"explain": map((v,i)=>({v,i})).sort(()=>Math.random()-.5);app.innerHTML='<section class="card"><small>المرحلة '+stage+' • السؤال '+(pos+1)+' من ٢٠ • '+x.topic+'</small><h3>'+x.q+'</h3>'+opts.map(o=>'<label><input type="radio" name="answer" value="'+o.i+'"> '+o.v+'</label>').join('')+'<button onclick="answer()">تحقق من الإجابة</button></section>'}function answer(){let el=document.querySelector('input[name=answer]:checked');if(!el){alert('اختاري إجابة أولًا');return}let x=quiz[pos],correct=+el.value===x.a;if(correct)score++;app.innerHTML='<section class="card"><h3 class="'+(correct?'ok':'bad')+'">'+(correct?'✓ إجابة صحيحة':'✗ إجابة تحتاج مراجعة')+'</h3><p><b>الإجابة الصحيحة:</b> '+x.opts[x.a]+'</p><h4>شرح طريقة الحل</h4><p>'+x.explain+'</p><button onclick="pos++;render()">السؤال التالي</button></section>'}function finish(){history.push({stage,score,date:new Date().toLocaleDateString('ar-SA')});localStorage.setItem('historyLicense',JSON.stringify(history));app.innerHTML='<section class="card"><h2>انتهت المحاولة 🌟</h2><h3>نتيجتك: '+score+' من ٢٠</h3><p>النسبة: '+score*5+'٪</p><button onclick="start(stage)">محاولة جديدة بأسئلة مختلفة</button><button onclick="home()">المراحل</button></section>'}home();</script></html>
