حة':'✗ إجابة تحتاج مراجعة')+'</h3><p><b>الإجابة الصحيحة:</b> '+x.opts[x.a]+'</p><h4>شرح الحل</h4><p>'+x.explain+'</p><button onclick="pos++;render()">التالي</button></section>'}function finish(){history.push({cat,stage,score,total:quiz.length,date:new Date().toLocaleDateString('ar-SA')});localStorage.setItem('licenseHistoryV2',JSON.stringify(history));app.innerHTML='<section class="card"><h2>انتهى التدريب 🌟</h2><h3>نتيجتك: '+score+' من '+quiz.length+'</h3><p>النسبة: '+Math.round(score/quiz.length*100)+'٪</p><button onclick="start(stage)">محاولة جديدة</button><button onclick="home()">العودة للمسارات</button></section>'}home();</script></html>
